# Render Blueprint for the FastAPI backend (free tier + external Postgres).
# The free plan has no persistent disk, so the database lives in a free managed
# Postgres (e.g. Neon) — set DATABASE_URL to its connection string in the dashboard.
# Note: free web services sleep after ~15 min idle, so the in-process scheduler
# only fires while the service is awake (Send now / manual email always work).
services:
  - type: web
    name: newsletter-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin Python — newer versions (3.14) lack prebuilt pydantic-core wheels and
      # fail trying to compile from Rust in Render's read-only build sandbox.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Generated once by Render; keeps login tokens valid across restarts.
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_PORT
        value: "587"
      # Secrets — set these in the Render dashboard (sync:false = not in the repo).
      - key: DATABASE_URL          # Neon Postgres connection string
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS       # e.g. https://your-app.vercel.app
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
